name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest

          - name: macOS
            os: macos-latest

          - name: iOS
            os: macos-latest
            target: iOS

          - name: Android32
            os: ubuntu-latest
            target: Android32

          - name: Android64
            os: ubuntu-latest
            target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build Geode mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: latest
          target: ${{ matrix.config.target }}
          combine: true

  package:
    name: Combine Geode packages
    runs-on: ubuntu-latest
    needs:
      - build

    steps:
      - name: Combine platform builds
        uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - name: Upload finished Geode mod
        uses: actions/upload-artifact@v7
        with:
          name: AltPulse-Geode
          path: ${{ steps.build.outputs.build-output }}
